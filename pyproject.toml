[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fontbench"
version = "1.0.0"
description = "FontBench: versioned visual typography recognition benchmark."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Edward Benson", email = "ted@edwardbenson.com" }
]
keywords = ["benchmark", "typography", "vlm", "harbor", "fonts", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0.0",
    "httpx>=0.28.0",
    "pillow>=10.0.0",
    "fonttools[woff]>=4.0.0",
    "pydantic>=2.0.0",
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
fontbench = "baseline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["baseline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
